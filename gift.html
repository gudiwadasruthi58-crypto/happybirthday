<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A warm welcome to your birthday surprise journey."
    />
    <title>Chapter 2: Welcome ❤️</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Great+Vibes&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/shared.css" />
    <link rel="stylesheet" href="css/gift.css" />
  </head>
  <body>
    <main class="journey" data-chapter="2">
      <section class="welcome-level" aria-label="Welcome message">
        <div class="welcome-container">
          <div class="welcome-content">
            <h1 id="welcomeHeading" class="welcome-heading"></h1>
            <p id="welcomeMessage" class="welcome-message"></p>
            
            <div class="welcome-photo-card">
              <img id="welcomePhoto" src="" alt="Welcome photo" class="welcome-photo" />
              <div class="photo-overlay"></div>
            </div>
            
            <div class="welcome-subtext">
              <p id="subtext1" class="subtext-line"></p>
              <p id="subtext2" class="subtext-line"></p>
            </div>
            
            <p id="secondaryMessage" class="secondary-message"></p>
            
            <button id="continueButton" class="primary-button welcome-button" type="button">
              <span id="buttonText"></span>
            </button>
          </div>
        </div>
      </section>
    </main>

    <script src="js/config.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/gift.js"></script>
  </body>
</html>
